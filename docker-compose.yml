services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_NAME: LawSphere
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lawsphere
      DB_USERNAME: lawsphere
      DB_PASSWORD: lawsphere_secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SEED_DATABASE: "true"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lawsphere
      MYSQL_USER: lawsphere
      MYSQL_PASSWORD: lawsphere_secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - lawsphere_mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lawsphere_mysql:
